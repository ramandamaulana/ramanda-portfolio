<!DOCTYPE html>
<html lang="id">

<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Top Donatur – SociaBuzz Leaderboard</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Comfortaa:wght@500;600&family=IBM+Plex+Mono:wght@400;500;600&display=swap" rel="stylesheet">
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        html,
        body {
            background: transparent;
            overflow: hidden;
            color: #333333;
        }

        body {
            min-height: 100vh;
            display: flex;
            align-items: flex-start;
            justify-content: flex-start;
            padding: 14px;
        }

        .leaderboard {
            width: min(760px, calc(100vw - 28px));
            background: #faae2b;
            border-radius: 20px;
            padding: 30px 45px 35px;
            box-shadow: 12px 12px 0px #1c1c1c;
            border: 2px solid #1c1c1c;
            position: relative;
        }

        .main-title {
            font-family: 'Comfortaa', cursive, sans-serif;
            font-size: 30px;
            line-height: 36px;
            font-weight: 600;
            text-align: center;
            letter-spacing: -0.5px;
            margin-bottom: 24px;
            color: #333333;
        }

        .list {
            display: flex;
            flex-direction: column;
            gap: 6px;
            font-family: 'IBM Plex Mono', monospace;
        }

        .item {
            display: grid;
            grid-template-columns: 38px 1fr auto;
            align-items: baseline;
            gap: 4px;
            padding: 2px 0;
        }

        .rank {
            font-size: 16px;
            line-height: 24px;
            font-weight: 400;
            color: #333333;
            white-space: nowrap;
        }

        .name {
            font-size: 16px;
            line-height: 24px;
            font-weight: 400;
            color: #333333;
            overflow: hidden;
            white-space: nowrap;
            text-overflow: ellipsis;
            min-width: 0;
        }

        .amount {
            font-size: 16px;
            line-height: 24px;
            font-weight: 400;
            color: #333333;
            text-align: right;
            white-space: nowrap;
            font-variant-numeric: tabular-nums;
        }

        .status {
            font-family: 'IBM Plex Mono', monospace;
            padding: 14px 0;
            font-size: 15px;
            color: rgba(51, 51, 51, 0.7);
            text-align: center;
            position: relative;
        }

        .error {
            color: #7a1a1a;
        }

        @keyframes blink {
            0%, 100% { opacity: 1; }
            50% { opacity: 0.4; }
        }

        .loading-text {
            animation: blink 1.2s ease-in-out infinite;
        }
    </style>
</head>

<body>
    <main class="leaderboard">
        <h1 class="main-title" id="sourceTitle">Memuat...</h1>
        <section class="list" id="list">
            <div class="status loading-text">Mengambil data SociaBuzz...</div>
        </section>
    </main>

    <script>
        const API_URL = "/api/leaderboard";
        const REFRESH_MS = 30000;

        const sourceTitle = document.getElementById("sourceTitle");
        const list = document.getElementById("list");

        function formatRank(index) {
            return `${index + 1}.`;
        }

        function escapeHtml(value) {
            if (value === undefined || value === null) return "";
            return String(value)
                .replace(/&/g, "&amp;")
                .replace(/</g, "&lt;")
                .replace(/>/g, "&gt;")
                .replace(/"/g, "&quot;")
                .replace(/'/g, "&#039;");
        }

        function render(data) {
            sourceTitle.textContent = data.title || "Top 10 Donatur";

            if (!data.leaderboard || !data.leaderboard.length) {
                list.innerHTML = `<div class="status">Belum ada data donatur.</div>`;
                return;
            }

            const donors = data.leaderboard.slice(0, 10);

            list.innerHTML = donors.map((item, index) => `
                <article class="item">
                    <div class="rank">${formatRank(index)}</div>
                    <div class="name" title="${escapeHtml(item.name)}">${escapeHtml(item.name)}</div>
                    <div class="amount">${item.amount ? escapeHtml(item.amount) : ""}</div>
                </article>
            `).join("");
        }

        async function fetchLeaderboardData() {
            const response = await fetch(`${API_URL}?_=${Date.now()}`, {
                method: "GET",
                cache: "no-store"
            });

            const data = await response.json();

            if (!response.ok || !data.ok) {
                throw new Error(data.error || `API HTTP ${response.status}`);
            }

            return data;
        }

        async function loadLeaderboard() {
            try {
                const data = await fetchLeaderboardData();
                render(data);
            } catch (error) {
                sourceTitle.textContent = "Gagal ambil data";
                list.innerHTML = `
                    <div class="status error">
                        Buka lewat server: <b>npm run donate</b><br>
                        lalu akses <b>http://localhost:8787/donate.html</b><br><br>
                        Error: <b>${escapeHtml(error.message)}</b>
                    </div>
                `;
                console.error(error);
            }
        }

        loadLeaderboard();
        setInterval(loadLeaderboard, REFRESH_MS);
    </script>
</body>

</html>
